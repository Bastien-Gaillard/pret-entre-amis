; Réglages de performance PHP pour le développement sous Docker.
; Le code est relu dès qu'il change (validate_timestamps), mais compilé une seule fois.
opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Évite de résoudre les mêmes chemins de fichiers à chaque requête.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

memory_limit = 256M
