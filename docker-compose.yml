services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: prets
      DB_USER: prets
      DB_PASSWORD: prets
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: prets
      MYSQL_USER: prets
      MYSQL_PASSWORD: prets
      MYSQL_ROOT_PASSWORD: root
      TZ: Europe/Paris
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
      # Exécutés une seule fois, à la création du volume, dans l'ordre alphabétique
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uprets", "-pprets"]
      interval: 5s
      retries: 10

volumes:
  db-data:
