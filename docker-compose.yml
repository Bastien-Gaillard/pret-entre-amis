services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_ENV: dev
      DATABASE_URL: "mysql://prets:prets@db:3306/prets?serverVersion=8.4.0&charset=utf8mb4"
    volumes:
      - ./:/var/www/html
      # vendor/ et var/ restent dans des volumes Docker : sous Windows, les lire
      # à travers le dossier partagé rend chaque page très lente.
      - vendor:/var/www/html/vendor
      - var:/var/www/html/var
    depends_on:
      - db

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: prets
      MYSQL_USER: prets
      MYSQL_PASSWORD: prets
      MYSQL_ROOT_PASSWORD: root
      TZ: Europe/Paris
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
  vendor:
  var:
